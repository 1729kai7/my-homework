<body>
    <div class="card">
        <h1>计算机网络课程作业</h1>

        <p><strong>姓名：</strong>请填写你的姓名</p>
        <p><strong>课程：</strong>计算机网络</p>
        <p><strong>作业编号：</strong>第一次作业</p>

        <h2>一、作业题目</h2>
        <p>什么是 HTTP 协议？请简述它的基本工作原理。</p>

        <h2>二、我的解答</h2>
        <p>
            HTTP 是一种用于客户端和服务器之间传输信息的应用层协议。
            当用户通过浏览器访问网页时，浏览器可以向服务器发送 HTTP 请求，
            服务器处理请求后，再向浏览器返回相应的数据。
        </p>

        <h2>三、总结</h2>
        <p>
            通过本次作业，我了解了 HTTP 协议的基本作用，
            以及浏览器与服务器之间的通信过程。
        </p>
    </div>
